<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Keys</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0d1a;
  color: #888;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 18px;
  padding: 20px;
  user-select: none;
  -webkit-user-select: none;
}

h1 {
  font-size: 1rem;
  letter-spacing: 0.55em;
  color: #00e5ff;
  font-weight: normal;
  text-transform: uppercase;
}

#mode-select {
  display: flex;
  border: 1px solid #252535;
  border-radius: 3px;
  overflow: hidden;
}

.mode-btn {
  background: none;
  border: none;
  color: #444;
  font-family: inherit;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  padding: 7px 24px;
  cursor: pointer;
  transition: all 0.15s;
}

.mode-btn.active { background: rgba(0,229,255,0.08); color: #00e5ff; }
.mode-btn:hover:not(.active) { color: #666; }

#hud {
  display: flex;
  align-items: baseline;
  gap: 24px;
}

#round-num {
  font-size: 2rem;
  color: #ddd;
  min-width: 2.5ch;
  text-align: right;
  line-height: 1;
}

#status-msg {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #444;
}

#best-line {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: #333;
  text-transform: uppercase;
}

#best-line span { color: #555; }

#hands-svg {
  width: min(700px, 96vw);
  height: auto;
  display: block;
}

#start-btn {
  background: none;
  border: 1px solid #00e5ff;
  color: #00e5ff;
  font-family: inherit;
  font-size: 0.75rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  padding: 10px 42px;
  cursor: pointer;
  transition: background 0.15s;
  outline: none;
}

#start-btn:hover  { background: rgba(0,229,255,0.07); }
#start-btn:active { background: rgba(0,229,255,0.15); }
#start-btn:focus-visible { outline: 1px solid #00e5ff; outline-offset: 3px; }
</style>
</head>
<body>

<h1>Simon Keys</h1>

<div id="mode-select">
  <button class="mode-btn active" data-mode="simon">Simon</button>
  <button class="mode-btn" data-mode="react">React</button>
</div>

<div id="hud">
  <span id="round-num">—</span>
  <span id="status-msg">home row trainer</span>
</div>

<svg id="hands-svg" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Palms (drawn first, fingers will overlap the top edge) -->
  <rect x="60"  y="162" width="228" height="132" rx="20" fill="#16162a"/>
  <rect x="412" y="162" width="228" height="132" rx="20" fill="#16162a"/>

  <!-- Fingers are injected by JS -->
  <g id="fingers-group"></g>
</svg>

<div id="best-line">best: <span id="best-num">—</span></div>
<button id="start-btn">Press SPACE to start</button>

<script>
// ── Finger / key definitions ──────────────────────────────────────────────────
// Standard typing-tutor color convention: same finger type = same color.
const COLOR = {
  index:  { idle: '#1a2540', active: '#6eb0ff' },
  middle: { idle: '#142814', active: '#6dd98f' },
  ring:   { idle: '#2e2508', active: '#ffd84d' },
  pinky:  { idle: '#2e1212', active: '#ff6b6b' },
};

// Left hand:  A=pinky, S=ring, D=middle, F=index  (left→right)
// Right hand: J=index, K=middle, L=ring, ;=pinky  (left→right)
const KEYS = [
  { id:'a', label:'A', xl: 65, xr:103, yt: 82, color: COLOR.pinky  },
  { id:'s', label:'S', xl:113, xr:151, yt: 62, color: COLOR.ring   },
  { id:'d', label:'D', xl:161, xr:199, yt: 52, color: COLOR.middle },
  { id:'f', label:'F', xl:209, xr:247, yt: 67, color: COLOR.index  },
  { id:'j', label:'J', xl:453, xr:491, yt: 67, color: COLOR.index  },
  { id:'k', label:'K', xl:501, xr:539, yt: 52, color: COLOR.middle },
  { id:'l', label:'L', xl:549, xr:587, yt: 62, color: COLOR.ring   },
  { id:';', label:';', xl:597, xr:635, yt: 82, color: COLOR.pinky  },
];

const FINGER_BOTTOM = 172; // overlap palm top edge (162) by 10px
const FINGER_RX     = 9;
const NS            = 'http://www.w3.org/2000/svg';

// ── Build SVG ─────────────────────────────────────────────────────────────────
function fingerPath(xl, xr, yt) {
  const yb = FINGER_BOTTOM, r = FINGER_RX;
  return `M${xl},${yb} L${xl},${yt+r} Q${xl},${yt} ${xl+r},${yt}` +
         ` L${xr-r},${yt} Q${xr},${yt} ${xr},${yt+r} L${xr},${yb}Z`;
}

function svgEl(tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (text !== undefined) el.textContent = text;
  return el;
}

const group = document.getElementById('fingers-group');
KEYS.forEach(k => {
  group.appendChild(svgEl('path', {
    id: 'fp-' + k.id, d: fingerPath(k.xl, k.xr, k.yt), fill: k.color.idle,
  }));
  group.appendChild(svgEl('text', {
    id: 'fl-' + k.id,
    x: (k.xl + k.xr) / 2, y: k.yt + 22,
    'text-anchor': 'middle', fill: k.color.active, 'fill-opacity': '0.4',
    'font-family': 'Courier New, monospace', 'font-size': '12',
    'font-weight': 'bold', 'pointer-events': 'none',
  }, k.label));
});

// ── State ─────────────────────────────────────────────────────────────────────
let mode      = 'simon';  // 'simon' | 'react'
let phase     = 'idle';   // idle | showing | input | wait | gameover
let inputLock = false;
let gen       = 0;        // incremented on every startGame(); cancels stale async chains

// Simon state
let sequence  = [];
let playerIdx = 0;
let simonBest = 0;

// React state
let reactScore  = 0;
let reactTarget = null;  // id of the currently lit key
let reactLitAt  = 0;     // performance.now() when finger was lit

// React high score persists in localStorage
const LS_KEY        = 'simon-keys-react-best';
const getReactBest  = ()  => parseInt(localStorage.getItem(LS_KEY) || '0', 10);
const saveReactBest = (s) => {
  if (s > getReactBest()) { localStorage.setItem(LS_KEY, String(s)); return true; }
  return false;
};

// ── DOM ───────────────────────────────────────────────────────────────────────
const roundEl  = document.getElementById('round-num');
const statusEl = document.getElementById('status-msg');
const bestEl   = document.getElementById('best-num');
const startBtn = document.getElementById('start-btn');

const setStatus = s  => statusEl.textContent = s;
const sleep     = ms => new Promise(r => setTimeout(r, ms));

function setRound(n) {
  // React mode: 0 is a valid score; Simon mode: 0 shows as dash
  roundEl.textContent = (mode === 'simon' && n === 0) ? '—' : n;
}

function refreshBest() {
  const b = mode === 'simon' ? simonBest : getReactBest();
  bestEl.textContent = b > 0 ? b : '—';
}

// ── Finger visuals ────────────────────────────────────────────────────────────
function setFinger(id, state) {
  const path  = document.getElementById('fp-' + id);
  const label = document.getElementById('fl-' + id);
  const key   = KEYS.find(k => k.id === id);
  if (!path || !key) return;

  if (state === 'active') {
    path.setAttribute('fill', key.color.active);
    path.setAttribute('filter', 'url(#glow)');
    label.setAttribute('fill', '#000');
    label.setAttribute('fill-opacity', '0.6');
  } else if (state === 'wrong') {
    path.setAttribute('fill', '#fff');
    path.setAttribute('filter', 'url(#glow)');
    label.setAttribute('fill', '#000');
    label.setAttribute('fill-opacity', '0.7');
  } else {
    path.setAttribute('fill', key.color.idle);
    path.removeAttribute('filter');
    label.setAttribute('fill', key.color.active);
    label.setAttribute('fill-opacity', '0.4');
  }
}

function resetFingers() { KEYS.forEach(k => setFinger(k.id, 'off')); }

// ── Mode switching ────────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (mode === btn.dataset.mode) return;
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b =>
      b.classList.toggle('active', b === btn));
    gen++;
    phase = 'idle';
    inputLock = false;
    reactTarget = null;
    resetFingers();
    setRound(0);
    setStatus(mode === 'simon' ? 'home row trainer' : 'reaction trainer');
    refreshBest();
    startBtn.textContent = 'Press SPACE to start';
  });
});

// ── Start / restart ───────────────────────────────────────────────────────────
function startGame() {
  gen++;
  phase     = 'idle';
  inputLock = false;
  resetFingers();
  startBtn.textContent = 'Press SPACE to restart';

  if (mode === 'simon') {
    sequence  = [];
    playerIdx = 0;
    setRound(0);
    grow(gen);
  } else {
    reactScore  = 0;
    reactTarget = null;
    setRound(0);
    beginReact(gen);
  }
}

// ── Simon mode ────────────────────────────────────────────────────────────────
function grow(g) {
  if (gen !== g) return;
  sequence.push(KEYS[Math.floor(Math.random() * KEYS.length)].id);
  setRound(sequence.length);
  playSequence(g);
}

async function playSequence(g) {
  if (gen !== g) return;
  phase = 'showing';
  setStatus('watch...');

  const lvl   = sequence.length;
  const onMs  = Math.max(260, 580 - lvl * 14);
  const offMs = Math.max(55,  125 - lvl *  5);

  await sleep(400);
  if (gen !== g) return;

  for (const id of sequence) {
    setFinger(id, 'active');
    await sleep(onMs);
    if (gen !== g) return;
    setFinger(id, 'off');
    await sleep(offMs);
    if (gen !== g) return;
  }

  await sleep(220);
  if (gen !== g) return;

  phase     = 'input';
  playerIdx = 0;
  inputLock = false;
  setStatus('your turn');
}

// ── React mode ────────────────────────────────────────────────────────────────
function beginReact(g) {
  if (gen !== g) return;
  setStatus('react!');
  lightNext(g);
}

function lightNext(g) {
  if (gen !== g) return;
  const target = KEYS[Math.floor(Math.random() * KEYS.length)];
  reactTarget = target.id;
  reactLitAt  = performance.now();
  phase       = 'input';
  inputLock   = false;
  setFinger(target.id, 'active');
}

// Points decrease linearly with reaction time; floor at 1
function reactionPts(ms) { return Math.max(1, Math.round(1000 - ms * 1.2)); }

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', async e => {
  const raw = e.key;

  if (raw === ' ') {
    e.preventDefault();
    if (phase === 'idle' || phase === 'gameover') startGame();
    return;
  }

  const key = (raw === ';' || raw === ':') ? ';' : raw.toLowerCase();
  if (!KEYS.find(k => k.id === key)) return;
  e.preventDefault();

  if (phase === 'idle' || phase === 'gameover') { startGame(); return; }
  if (phase !== 'input' || inputLock) return;

  inputLock = true;
  const myGen = gen;

  // ── React branch ──────────────────────────────────────────────────────────
  if (mode === 'react') {
    const ms  = performance.now() - reactLitAt;
    const was = reactTarget;
    setFinger(was, 'off');

    if (key === was) {
      const pts = reactionPts(ms);
      reactScore += pts;
      setRound(reactScore);
      setStatus(`+${pts}`);
      await sleep(90);
      if (gen !== myGen) return;
      setStatus('react!');
      lightNext(myGen);
    } else {
      phase = 'gameover';
      setFinger(key, 'wrong');
      const isNew = saveReactBest(reactScore);
      refreshBest();
      await sleep(750);
      if (gen !== myGen) return;
      setFinger(key, 'off');
      setStatus(isNew
        ? `new best: ${reactScore} — press space`
        : `wrong key — press space`);
    }
    return;
  }

  // ── Simon branch ──────────────────────────────────────────────────────────
  if (key === sequence[playerIdx]) {
    setFinger(key, 'active');
    await sleep(155);
    if (gen !== myGen) return;
    setFinger(key, 'off');
    playerIdx++;

    if (playerIdx === sequence.length) {
      if (sequence.length > simonBest) { simonBest = sequence.length; refreshBest(); }
      phase = 'wait';
      setStatus('nice!');
      await sleep(620);
      if (gen !== myGen) return;
      grow(myGen);
    } else {
      inputLock = false;
    }
  } else {
    phase = 'gameover';
    setFinger(key, 'wrong');
    await sleep(750);
    if (gen !== myGen) return;
    setFinger(key, 'off');
    setStatus('wrong key — press space');
  }
});

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
