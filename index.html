<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Keys</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0d1a;
  color: #888;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 14px;
  padding: 20px;
  user-select: none;
  -webkit-user-select: none;
}

h1 {
  font-size: 1rem;
  letter-spacing: 0.55em;
  color: #00e5ff;
  font-weight: normal;
  text-transform: uppercase;
}

#mode-select, #diff-select {
  display: flex;
  border: 1px solid #252535;
  border-radius: 3px;
  overflow: hidden;
}

#diff-select { display: none; }

.mode-btn, .diff-btn {
  background: none;
  border: none;
  color: #444;
  font-family: inherit;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  padding: 7px 22px;
  cursor: pointer;
  transition: all 0.15s;
}

.mode-btn.active, .diff-btn.active { background: rgba(0,229,255,0.08); color: #00e5ff; }
.mode-btn:hover:not(.active), .diff-btn:hover:not(.active) { color: #666; }

#hud {
  display: flex;
  align-items: baseline;
  gap: 24px;
}

#round-num {
  font-size: 2rem;
  color: #ddd;
  min-width: 2.5ch;
  text-align: right;
  line-height: 1;
}

#status-msg {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #444;
}

#best-line {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: #333;
  text-transform: uppercase;
}

#best-line span { color: #555; }

#balloon-svg, #hands-svg {
  width: min(700px, 96vw);
  height: auto;
  display: block;
}

#balloon-svg { display: none; }

#start-btn {
  background: none;
  border: 1px solid #00e5ff;
  color: #00e5ff;
  font-family: inherit;
  font-size: 0.75rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  padding: 10px 42px;
  cursor: pointer;
  transition: background 0.15s;
  outline: none;
}

#start-btn:hover  { background: rgba(0,229,255,0.07); }
#start-btn:active { background: rgba(0,229,255,0.15); }
#start-btn:focus-visible { outline: 1px solid #00e5ff; outline-offset: 3px; }
</style>
</head>
<body>

<h1>Simon Keys</h1>

<div id="mode-select">
  <button class="mode-btn active" data-mode="simon">Simon</button>
  <button class="mode-btn" data-mode="react">React</button>
  <button class="mode-btn" data-mode="balloon">Balloon</button>
</div>

<div id="diff-select">
  <button class="diff-btn" data-diff="easy">Easy</button>
  <button class="diff-btn active" data-diff="medium">Medium</button>
  <button class="diff-btn" data-diff="hard">Hard</button>
</div>

<div id="hud">
  <span id="round-num">—</span>
  <span id="status-msg">home row trainer</span>
</div>

<!-- Balloon play area — shown only in Balloon mode -->
<svg id="balloon-svg" viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg">
  <line x1="60" y1="155" x2="640" y2="155" stroke="#1e1e30" stroke-width="1.5"/>
  <g id="balloon-group">
    <line id="balloon-string" x1="350" y1="106" x2="350" y2="126"
          stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    <circle id="balloon-knot"  cx="350" cy="104" r="3.5" fill="#b84480"/>
    <circle id="balloon-body"  cx="350" cy="80"  r="24"  fill="#ff6eb4"/>
    <circle id="balloon-shine" cx="342" cy="70"  r="7"   fill="rgba(255,255,255,0.30)"
            pointer-events="none"/>
  </g>
</svg>

<svg id="hands-svg" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="60"  y="162" width="228" height="132" rx="20" fill="#16162a"/>
  <rect x="412" y="162" width="228" height="132" rx="20" fill="#16162a"/>
  <g id="fingers-group"></g>
</svg>

<div id="best-line">best: <span id="best-num">—</span></div>
<button id="start-btn">Press SPACE to start</button>

<script>
// ── Finger / key definitions ──────────────────────────────────────────────────
const COLOR = {
  index:  { idle: '#1a2540', active: '#6eb0ff' },
  middle: { idle: '#142814', active: '#6dd98f' },
  ring:   { idle: '#2e2508', active: '#ffd84d' },
  pinky:  { idle: '#2e1212', active: '#ff6b6b' },
};

const KEYS = [
  { id:'a', label:'A', xl: 65, xr:103, yt: 82, color: COLOR.pinky  },
  { id:'s', label:'S', xl:113, xr:151, yt: 62, color: COLOR.ring   },
  { id:'d', label:'D', xl:161, xr:199, yt: 52, color: COLOR.middle },
  { id:'f', label:'F', xl:209, xr:247, yt: 67, color: COLOR.index  },
  { id:'j', label:'J', xl:453, xr:491, yt: 67, color: COLOR.index  },
  { id:'k', label:'K', xl:501, xr:539, yt: 52, color: COLOR.middle },
  { id:'l', label:'L', xl:549, xr:587, yt: 62, color: COLOR.ring   },
  { id:';', label:';', xl:597, xr:635, yt: 82, color: COLOR.pinky  },
];

const FINGER_BOTTOM = 172;
const FINGER_RX     = 9;
const NS            = 'http://www.w3.org/2000/svg';

// ── Balloon constants ─────────────────────────────────────────────────
const BALLOON_R     = 24;
const BALLOON_CEIL  = 27;   // min center y (ceiling)
const BALLOON_FLOOR = 133;  // max center y — bottom of balloon at y=157, at the floor line
const BALLOON_START = 80;

// gravity: px/frame², bounce: initial upward px/frame (negative = up)
const DIFFICULTY = {
  easy:   { gravity: 0.055, bounce: -7.0  },
  medium: { gravity: 0.120, bounce: -8.5  },
  hard:   { gravity: 0.220, bounce: -10.5 },
};

const MODES = ['simon', 'react', 'balloon'];
const DIFFS = ['easy', 'medium', 'hard'];

// ── Game state ────────────────────────────────────────────────────────────────
let mode       = 'simon';
let difficulty = 'medium';
let phase      = 'idle';   // idle | showing | input | wait | gameover
let inputLock  = false;
let gen        = 0;        // incremented on startGame; all async chains check this

// Simon
let sequence  = [];
let playerIdx = 0;
let simonBest = 0;

// React + Balloon share the "active target" pattern
let reactScore  = 0;
let reactTarget = null;   // id of the currently lit finger
let reactLitAt  = 0;      // performance.now() when finger lit (React only)

// Balloon
let balloonScore = 0;
let balloonY   = BALLOON_START;
let balloonVY  = 0;
let rafId      = null;

// ── LocalStorage ──────────────────────────────────────────────────────────────
function makeLS(key) {
  return {
    get:  ()  => parseInt(localStorage.getItem(key) || '0', 10),
    save: (s) => {
      if (s > parseInt(localStorage.getItem(key) || '0', 10)) {
        localStorage.setItem(key, String(s));
        return true;
      }
      return false;
    },
  };
}
const reactLS = makeLS('simon-keys-react-best');
const balloonLS = makeLS('simon-keys-balloon-best');

// ── Build SVG fingers ─────────────────────────────────────────────────────────
function fingerPath(xl, xr, yt) {
  const yb = FINGER_BOTTOM, r = FINGER_RX;
  return `M${xl},${yb} L${xl},${yt+r} Q${xl},${yt} ${xl+r},${yt}` +
         ` L${xr-r},${yt} Q${xr},${yt} ${xr},${yt+r} L${xr},${yb}Z`;
}

function svgEl(tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (text !== undefined) el.textContent = text;
  return el;
}

const group = document.getElementById('fingers-group');
KEYS.forEach(k => {
  group.appendChild(svgEl('path', {
    id: 'fp-' + k.id, d: fingerPath(k.xl, k.xr, k.yt), fill: k.color.idle,
  }));
  group.appendChild(svgEl('text', {
    id: 'fl-' + k.id, x: (k.xl + k.xr) / 2, y: k.yt + 22,
    'text-anchor': 'middle', fill: k.color.active, 'fill-opacity': '0.4',
    'font-family': 'Courier New, monospace', 'font-size': '12',
    'font-weight': 'bold', 'pointer-events': 'none',
  }, k.label));
});

// ── DOM refs ──────────────────────────────────────────────────────────────────
const roundEl    = document.getElementById('round-num');
const statusEl   = document.getElementById('status-msg');
const bestEl     = document.getElementById('best-num');
const startBtn   = document.getElementById('start-btn');
const balloonSvg = document.getElementById('balloon-svg');
const diffSelect = document.getElementById('diff-select');

const setStatus = s  => statusEl.textContent = s;
const sleep     = ms => new Promise(r => setTimeout(r, ms));

function setRound(n) {
  roundEl.textContent = (mode === 'simon' && n === 0) ? '—' : n;
}

function refreshBest() {
  const b = mode === 'simon' ? simonBest
          : mode === 'react' ? reactLS.get()
          : balloonLS.get();
  bestEl.textContent = b > 0 ? b : '—';
}

// ── Finger visuals ────────────────────────────────────────────────────────────
function setFinger(id, state) {
  const path  = document.getElementById('fp-' + id);
  const label = document.getElementById('fl-' + id);
  const key   = KEYS.find(k => k.id === id);
  if (!path || !key) return;
  if (state === 'active') {
    path.setAttribute('fill', key.color.active);
    path.setAttribute('filter', 'url(#glow)');
    label.setAttribute('fill', '#000');
    label.setAttribute('fill-opacity', '0.6');
  } else if (state === 'wrong') {
    path.setAttribute('fill', '#fff');
    path.setAttribute('filter', 'url(#glow)');
    label.setAttribute('fill', '#000');
    label.setAttribute('fill-opacity', '0.7');
  } else {
    path.setAttribute('fill', key.color.idle);
    path.removeAttribute('filter');
    label.setAttribute('fill', key.color.active);
    label.setAttribute('fill-opacity', '0.4');
  }
}

function resetFingers() { KEYS.forEach(k => setFinger(k.id, 'off')); }

// ── Mode & difficulty switching ───────────────────────────────────────────────
function switchMode(newMode) {
  if (mode === newMode) return;
  mode = newMode;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === newMode));
  gen++;
  stopBalloon();
  phase       = 'idle';
  inputLock   = false;
  reactTarget = null;
  resetFingers();
  setRound(0);
  setStatus(newMode === 'simon' ? 'home row trainer'
          : newMode === 'react' ? 'reaction trainer'
          : 'balloon');
  refreshBest();
  startBtn.textContent = 'Press SPACE to start';
  balloonSvg.style.display = newMode === 'balloon' ? 'block' : 'none';
  diffSelect.style.display  = newMode === 'balloon' ? 'flex'  : 'none';
  if (newMode === 'balloon') resetBalloon();
}

function switchDifficulty(newDiff) {
  difficulty = newDiff;
  document.querySelectorAll('.diff-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.diff === newDiff));
}

document.querySelectorAll('.mode-btn').forEach(btn =>
  btn.addEventListener('click', () => switchMode(btn.dataset.mode)));

document.querySelectorAll('.diff-btn').forEach(btn =>
  btn.addEventListener('click', () => {
    if (phase !== 'idle' && phase !== 'gameover') return;
    switchDifficulty(btn.dataset.diff);
  }));

// ── Start / restart ───────────────────────────────────────────────────────────
function startGame() {
  gen++;
  phase       = 'idle';
  inputLock   = false;
  reactTarget = null;
  resetFingers();
  startBtn.textContent = 'Press SPACE to restart';

  if (mode === 'simon') {
    sequence  = [];
    playerIdx = 0;
    setRound(0);
    grow(gen);
  } else if (mode === 'react') {
    reactScore = 0;
    setRound(0);
    beginReact(gen);
  } else {
    balloonScore = 0;
    setRound(0);
    beginBalloon(gen);
  }
}

// ── Simon mode ────────────────────────────────────────────────────────────────
function grow(g) {
  if (gen !== g) return;
  sequence.push(KEYS[Math.floor(Math.random() * KEYS.length)].id);
  setRound(sequence.length);
  playSequence(g);
}

async function playSequence(g) {
  if (gen !== g) return;
  phase = 'showing';
  setStatus('watch...');
  const lvl   = sequence.length;
  const onMs  = Math.max(260, 580 - lvl * 14);
  const offMs = Math.max(55,  125 - lvl *  5);
  await sleep(400);
  if (gen !== g) return;
  for (const id of sequence) {
    setFinger(id, 'active');
    await sleep(onMs);
    if (gen !== g) return;
    setFinger(id, 'off');
    await sleep(offMs);
    if (gen !== g) return;
  }
  await sleep(220);
  if (gen !== g) return;
  phase     = 'input';
  playerIdx = 0;
  inputLock = false;
  setStatus('your turn');
}

// ── React mode ────────────────────────────────────────────────────────────────
function beginReact(g) {
  if (gen !== g) return;
  setStatus('react!');
  lightNextReact(g);
}

function lightNextReact(g) {
  if (gen !== g) return;
  const t = KEYS[Math.floor(Math.random() * KEYS.length)];
  reactTarget = t.id;
  reactLitAt  = performance.now();
  phase       = 'input';
  inputLock   = false;
  setFinger(t.id, 'active');
}

function reactionPts(ms) { return Math.max(1, Math.round(1000 - ms * 1.2)); }

// ── Balloon mode ───────────────────────────────────────────────────────────
function resetBalloon() {
  balloonY  = BALLOON_START;
  balloonVY = 0;
  const grp = document.getElementById('balloon-group');
  if (grp) grp.style.visibility = 'visible';
  const body = document.getElementById('balloon-body');
  if (body) {
    body.setAttribute('r', String(BALLOON_R));
    body.setAttribute('fill', '#ff6eb4');
  }
  const shine = document.getElementById('balloon-shine');
  if (shine) shine.setAttribute('r', '7');
  updateBalloonPos();
}

function updateBalloonPos() {
  const cy = balloonY;
  document.getElementById('balloon-body') .setAttribute('cy', cy);
  document.getElementById('balloon-shine').setAttribute('cy', cy - 10);
  document.getElementById('balloon-knot') .setAttribute('cy', cy + BALLOON_R + 2);
  document.getElementById('balloon-string').setAttribute('y1', cy + BALLOON_R + 5);
  document.getElementById('balloon-string').setAttribute('y2', cy + BALLOON_R + 22);
}

function stopBalloon() {
  if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
}

function beginBalloon(g) {
  if (gen !== g) return;
  resetBalloon();
  setStatus('');
  // Light first finger, then start physics
  lightNextBalloon(g);
  rafId = requestAnimationFrame(makeBalloonTick(g));
}

function lightNextBalloon(g) {
  if (gen !== g) return;
  const t = KEYS[Math.floor(Math.random() * KEYS.length)];
  reactTarget = t.id;
  phase       = 'input';
  inputLock   = false;
  setFinger(t.id, 'active');
}

function makeBalloonTick(g) {
  function tick() {
    if (gen !== g) return;
    const { gravity } = DIFFICULTY[difficulty];
    balloonVY += gravity;
    balloonY  += balloonVY;

    if (balloonY >= BALLOON_FLOOR) {
      balloonY = BALLOON_FLOOR;
      updateBalloonPos();
      balloonOver(g, null);   // floor hit — no wrong key
      return;
    }

    if (balloonY < BALLOON_CEIL) {
      balloonY  = BALLOON_CEIL;
      balloonVY = 0;
    }

    updateBalloonPos();
    rafId = requestAnimationFrame(tick);
  }
  return tick;
}

async function balloonOver(g, wrongKey) {
  if (gen !== g || phase === 'gameover') return;
  phase = 'gameover';
  stopBalloon();
  if (reactTarget) { setFinger(reactTarget, 'off'); reactTarget = null; }
  if (wrongKey)    setFinger(wrongKey, 'wrong');

  // Pop: flash white + expand, then hide
  const body  = document.getElementById('balloon-body');
  const shine = document.getElementById('balloon-shine');
  if (body) {
    body.setAttribute('fill', '#fff');
    body.setAttribute('r', String(BALLOON_R + 12));
    shine.setAttribute('r', '0');
  }
  await sleep(110);
  if (gen !== g) return;
  document.getElementById('balloon-group').style.visibility = 'hidden';

  if (wrongKey) {
    await sleep(400);
    if (gen !== g) return;
    setFinger(wrongKey, 'off');
  }

  const isNew = balloonLS.save(balloonScore);
  refreshBest();
  setStatus(isNew
    ? `new best: ${balloonScore} — press space`
    : wrongKey ? 'wrong key — press space' : 'balloon popped — press space');
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', async e => {
  const raw = e.key;

  // Left / Right: cycle mode
  if (raw === 'ArrowLeft' || raw === 'ArrowRight') {
    e.preventDefault();
    const d = raw === 'ArrowRight' ? 1 : -1;
    switchMode(MODES[(MODES.indexOf(mode) + d + MODES.length) % MODES.length]);
    return;
  }

  // Up / Down: cycle difficulty (only when not actively playing)
  if (raw === 'ArrowUp' || raw === 'ArrowDown') {
    e.preventDefault();
    if (phase === 'idle' || phase === 'gameover') {
      const d = raw === 'ArrowDown' ? 1 : -1;
      switchDifficulty(DIFFS[(DIFFS.indexOf(difficulty) + d + DIFFS.length) % DIFFS.length]);
    }
    return;
  }

  if (raw === ' ') {
    e.preventDefault();
    if (phase === 'idle' || phase === 'gameover') startGame();
    return;
  }

  const key = (raw === ';' || raw === ':') ? ';' : raw.toLowerCase();
  if (!KEYS.find(k => k.id === key)) return;
  e.preventDefault();

  if (phase === 'idle' || phase === 'gameover') { startGame(); return; }
  // Block input if not in input phase, if locked, or if balloon has no active target yet
  if (phase !== 'input' || inputLock || (mode === 'balloon' && !reactTarget)) return;

  inputLock = true;
  const myGen = gen;

  // ── Balloon branch ──────────────────────────────────────────────────────────
  if (mode === 'balloon') {
    const was = reactTarget;
    if (key === was) {
      setFinger(was, 'off');
      balloonVY = DIFFICULTY[difficulty].bounce;  // bounce up
      balloonScore++;
      setRound(balloonScore);
      lightNextBalloon(myGen);  // lights new finger, resets inputLock + reactTarget
    } else {
      await balloonOver(myGen, key);
    }
    return;
  }

  // ── React branch ──────────────────────────────────────────────────────────
  if (mode === 'react') {
    const ms  = performance.now() - reactLitAt;
    const was = reactTarget;
    setFinger(was, 'off');
    if (key === was) {
      const pts = reactionPts(ms);
      reactScore += pts;
      setRound(reactScore);
      setStatus(`+${pts}`);
      await sleep(90);
      if (gen !== myGen) return;
      setStatus('react!');
      lightNextReact(myGen);
    } else {
      phase = 'gameover';
      setFinger(key, 'wrong');
      const isNew = reactLS.save(reactScore);
      refreshBest();
      await sleep(750);
      if (gen !== myGen) return;
      setFinger(key, 'off');
      setStatus(isNew ? `new best: ${reactScore} — press space` : 'wrong key — press space');
    }
    return;
  }

  // ── Simon branch ──────────────────────────────────────────────────────────
  if (key === sequence[playerIdx]) {
    setFinger(key, 'active');
    await sleep(155);
    if (gen !== myGen) return;
    setFinger(key, 'off');
    playerIdx++;
    if (playerIdx === sequence.length) {
      if (sequence.length > simonBest) { simonBest = sequence.length; refreshBest(); }
      phase = 'wait';
      setStatus('nice!');
      await sleep(620);
      if (gen !== myGen) return;
      grow(myGen);
    } else {
      inputLock = false;
    }
  } else {
    phase = 'gameover';
    setFinger(key, 'wrong');
    await sleep(750);
    if (gen !== myGen) return;
    setFinger(key, 'off');
    setStatus('wrong key — press space');
  }
});

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
